name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check NuGet login without publishing
        type: boolean
        default: true

jobs:
  publish:
    uses: bfren/dotnet/.github/workflows/publish-nuget.yml@main
    permissions:
      contents: read    # checkout - listing permissions here turns off any not listed
      id-token: write   # lets NuGet/login exchange a GitHub token for a 1-hour NuGet key
      packages: write   # GitHub Packages push
    with:
      solution: "Wrap.slnx"
      name: Wrap
      dry_run: ${{ inputs.dry_run == true }} # inputs.dry_run is empty on release, so this is false
    secrets: inherit
